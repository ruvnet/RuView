name: Operator eight-step diagnostic (not release qualification)

on:
  push:
    branches: [diag/2527-operator-eight-20261112]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install the reviewed signed Ubuntu dependency set
        run: |
          bash scripts/ci-install-ubuntu-deps.sh \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libudev-dev libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: v2
      - name: Record non-secret runner and compiler context
        working-directory: v2
        run: |
          printf 'source=%s\n' "$GITHUB_SHA"
          rustc -Vv
          cargo -V
          lscpu
          df -h "$RUNNER_TEMP"
      - name: Execute the original complete Release profile sequence
        run: |
          python3 scripts/ci/test_temporal_test_profiles.py
          python3 scripts/ci/temporal_test_profiles.py release-run --evidence-dir "${{ runner.temp }}/temporal-test-profiles"
      - name: Retain diagnostic output even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-eight-diagnostic
          path: ${{ runner.temp }}/temporal-test-profiles
