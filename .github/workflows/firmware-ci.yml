name: Firmware CI

on:
  push:
    branches:
      - '**'
    tags:
      # ESP32 firmware release tags — build + version-consistency guard (RuView#505).
      - 'v*-esp32'
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-ci.yml'

jobs:
  provisioning-tests:
    name: Provisioning tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify provisioning and secret handling without hardware
        run: python -m unittest discover -s firmware/esp32-csi-node/tests -p 'test_provision*.py' -v
      - name: Verify release manifest generation, signing and offsets (synthetic bundles)
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.7
          python -m unittest discover -s firmware/esp32-csi-node/tests -p 'test_release_manifest*.py' -v

  version-guard:
    name: Verify version.txt matches release tag
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Check firmware version.txt == tag
        run: |
          # Tag form: vX.Y.Z-esp32  →  expect version.txt to contain X.Y.Z
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          EXPECTED="${EXPECTED%-esp32}"
          ACTUAL="$(tr -d '[:space:]' < firmware/esp32-csi-node/version.txt)"
          echo "Tag: $TAG  →  expected version.txt: $EXPECTED  |  actual: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::firmware/esp32-csi-node/version.txt is '$ACTUAL' but tag '$TAG' expects '$EXPECTED'."
            echo "::error::Bump version.txt and re-tag so esp_app_get_description()->version is correct (RuView#505)."
            exit 1
          fi
          echo "version.txt matches the release tag."

  build:
    name: Build firmware (${{ matrix.target }} / ${{ matrix.variant }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.idf_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 8mb
            idf_image: espressif/idf:v5.4
            target: esp32s3
            sdkconfig: sdkconfig.defaults
            partition_table_name: partitions_display.csv
            size_warn_kb: 1100
            # Current 8 MB image is 1163 KiB after USB onboarding. The OTA app
            # partition is 2048 KiB; retain a 1200 KiB hard gate and warning.
            size_limit_kb: 1200
            artifact_app: esp32-csi-node.bin
            artifact_pt: partition-table.bin
          - variant: 4mb
            idf_image: espressif/idf:v5.4
            target: esp32s3
            sdkconfig: sdkconfig.defaults.4mb
            partition_table_name: partitions_4mb.csv
            size_warn_kb: 1100
            size_limit_kb: 1152
            artifact_app: esp32-csi-node-4mb.bin
            artifact_pt: partition-table-4mb.bin
          # ADR-110: ESP32-C6 research target (Wi-Fi 6 / 802.15.4 / TWT / LP-core)
          - variant: c6-4mb
            idf_image: espressif/idf:v5.4
            target: esp32c6
            sdkconfig: sdkconfig.defaults
            partition_table_name: partitions_4mb.csv
            size_warn_kb: 1100
            size_limit_kb: 1152
            artifact_app: esp32-csi-node-c6.bin
            artifact_pt: partition-table-c6.bin
          # C5 uses the stable IDF 6 lane; older preview drivers are not supported.
          - variant: c5-4mb
            idf_image: espressif/idf:v6.0.2
            target: esp32c5
            sdkconfig: sdkconfig.defaults
            partition_table_name: partitions_4mb.csv
            size_warn_kb: 1100
            size_limit_kb: 1152
            artifact_app: esp32-csi-node-c5.bin
            artifact_pt: partition-table-c5.bin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Build firmware (${{ matrix.variant }})
        working-directory: firmware/esp32-csi-node
        run: |
          . $IDF_PATH/export.sh
          # 4mb variant supplies its own sdkconfig.defaults overlay.
          # c6-4mb variant relies on the auto-applied sdkconfig.defaults.esp32c6
          # overlay (ESP-IDF auto-loads sdkconfig.defaults.$TARGET when present).
          if [ "${{ matrix.variant }}" = "4mb" ]; then
            cp "${{ matrix.sdkconfig }}" sdkconfig.defaults
          fi
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Build and run host-side firmware unit tests
        if: matrix.variant == 'c6-4mb'
        working-directory: firmware/esp32-csi-node/test
        run: |
          make host_tests

      - name: Verify binary size budget
        working-directory: firmware/esp32-csi-node
        run: |
          BIN=build/esp32-csi-node.bin
          SIZE=$(stat -c%s "$BIN")
          MAX=$((${{ matrix.size_limit_kb }} * 1024))
          WARN=$((${{ matrix.size_warn_kb }} * 1024))
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 )) KB)"
          echo "Warning at:  $WARN bytes (${{ matrix.size_warn_kb }} KB)"
          echo "Size limit:  $MAX bytes (${{ matrix.size_limit_kb }} KB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Firmware binary exceeds ${{ matrix.size_limit_kb }} KB size gate ($SIZE > $MAX)"
            exit 1
          fi
          if [ "$SIZE" -gt "$WARN" ]; then
            echo "::warning::Firmware binary exceeds the ${{ matrix.size_warn_kb }} KB soft budget ($SIZE > $WARN); hard limit is ${{ matrix.size_limit_kb }} KB"
          fi
          echo "Binary size OK: $SIZE <= $MAX"

      - name: Verify built application version, chip, and flash layout
        working-directory: firmware/esp32-csi-node
        run: python test/test_delivery_contract.py --built-app build/esp32-csi-node.bin --target ${{ matrix.target }} --flasher-args build/flasher_args.json

      - name: Verify flash image integrity
        working-directory: firmware/esp32-csi-node
        run: |
          ERRORS=0
          BIN=build/esp32-csi-node.bin

          if [ ! -s "$BIN" ]; then
            echo "::error::Binary not found or empty"
            exit 1
          fi

          PT=build/partition_table/partition-table.bin
          if [ -f "$PT" ]; then
            MAGIC=$(od -A n -t x1 -N 2 "$PT" | tr -d ' ')
            if [ "$MAGIC" != "aa50" ]; then
              echo "::warning::Partition table magic mismatch: $MAGIC (expected aa50)"
              ERRORS=$((ERRORS + 1))
            fi
          fi

          BL=build/bootloader/bootloader.bin
          if [ ! -s "$BL" ]; then
            echo "::warning::Bootloader binary missing or empty"
            ERRORS=$((ERRORS + 1))
          fi

          NONZERO=$(od -A n -t x1 -N 1024 "$BIN" | tr -d ' f\n' | wc -c)
          if [ "$NONZERO" -lt 100 ]; then
            echo "::error::Binary appears to be mostly padding (non-zero chars: $NONZERO)"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Flash image verification completed with $ERRORS warning(s)"
          else
            echo "Flash image integrity verified"
          fi

      - name: Stage release binaries with variant-specific names
        working-directory: firmware/esp32-csi-node
        run: |
          mkdir -p release-staging
          cp build/esp32-csi-node.bin                      release-staging/${{ matrix.artifact_app }}
          cp build/partition_table/partition-table.bin     release-staging/${{ matrix.artifact_pt }}
          cp build/bootloader/bootloader.bin               release-staging/bootloader.bin
          cp build/ota_data_initial.bin                    release-staging/ota_data_initial.bin
          cp version.txt                                   release-staging/version.txt
          # IDF's own flash plan for this build: clients read offsets from it (RuView#2394).
          cp build/flasher_args.json                       release-staging/flasher_args.json
          (cd release-staging && sha256sum \
            "${{ matrix.artifact_app }}" \
            "${{ matrix.artifact_pt }}" \
            bootloader.bin ota_data_initial.bin version.txt flasher_args.json \
            > SHA256SUMS.txt)
          ls -la release-staging/

      - name: Check QEMU ESP32-S3 support status
        run: |
          echo "::notice::ESP32-S3 QEMU support is experimental in ESP-IDF v5.4. "
          echo "Full smoke testing requires QEMU 8.2+ with xtensa-esp32s3 target."
          echo "See: https://github.com/espressif/qemu/wiki"

      - name: Upload firmware artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: esp32-csi-node-firmware-${{ matrix.variant }}
          path: firmware/esp32-csi-node/release-staging/
          retention-days: 90

  build-c6-idf6:
    name: Build XIAO C6 external antenna (ESP-IDF 6.0.2)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Build the IDF 6 canary image
        working-directory: firmware/esp32-csi-node
        run: |
          . $IDF_PATH/export.sh
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c6;sdkconfig.defaults.xiao-external" set-target esp32c6
          idf.py build
          test "$(stat -c%s build/esp32-csi-node.bin)" -le $((1152 * 1024))
          strings build/esp32-csi-node.bin | grep -F "external U.FL"

  publish-release-assets:
    name: Publish firmware release assets
    if: github.ref_type == 'tag'
    needs: [version-guard, provisioning-tests, build, build-c6-idf6]
    runs-on: ubuntu-latest
    # Signing (RuView#2394). Main path: when the repository VARIABLE FIRMWARE_SIGNING_KMS_KEY
    # is set, this job signs the manifest with a Cloud KMS Ed25519 key over Workload Identity
    # Federation. No private key and no GitHub secret is involved: the key never leaves KMS and
    # the federated token can only call asymmetricSign on that one key. When the variable is
    # unset, CI publishes an UNSIGNED prerelease and a maintainer runs
    # `release_manifest.py sign-release` (fallback). See release-signing/README.md.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Download the exact-run firmware artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: esp32-csi-node-firmware-*
          path: release-downloads

      - name: Package variants without filename collisions
        run: |
          mkdir -p release-assets
          for directory in release-downloads/esp32-csi-node-firmware-*; do
            variant="${directory##*/}"
            tar -C "$directory" -czf "release-assets/${variant}.tar.gz" .
          done
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Resolve the release channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CHANNEL="$(tr -d '[:space:]' < firmware/esp32-csi-node/RELEASE_CHANNEL)"
          case "$CHANNEL" in
            stable|prerelease) ;;
            *) echo "::error::RELEASE_CHANNEL must be 'stable' or 'prerelease', got '$CHANNEL'"; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?-esp32$'; then
            echo "::error::Tag '$TAG' is not v<semver>-esp32"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Release channel: $CHANNEL (a stable release is published as a prerelease until signed)"

      - name: Generate the release manifest from the exact-run bundles
        env:
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REVOKES="$(sed -e 's/#.*//' -e 's/[[:space:]]//g' firmware/esp32-csi-node/REVOKED_VERSIONS | grep -v '^$' | paste -sd, - || true)"
          python firmware/esp32-csi-node/tools/release_manifest.py generate \
            --tag "$TAG" --assets release-assets --channel "$CHANNEL" \
            --source-commit "$GITHUB_SHA" --workflow-run "$RUN_URL" \
            --revokes "$REVOKES" \
            --out release-assets/firmware-manifest.json

      - name: Verify the manifest, archives, images and offsets before upload
        run: |
          python firmware/esp32-csi-node/tools/release_manifest.py verify \
            --manifest release-assets/firmware-manifest.json --assets release-assets --allow-unsigned

      - name: Check the CI signing configuration
        if: vars.FIRMWARE_SIGNING_KMS_KEY != ''
        env:
          WIF_PROVIDER: ${{ vars.FIRMWARE_SIGNING_WIF_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::FIRMWARE_SIGNING_KMS_KEY is set but FIRMWARE_SIGNING_WIF_PROVIDER is not set"
            exit 1
          fi
          if [ ! -s firmware/esp32-csi-node/release-signing/public-key.ed25519.b64 ]; then
            echo "::error::CI signing is configured but firmware/esp32-csi-node/release-signing/public-key.ed25519.b64 is not committed"
            exit 1
          fi

      - name: Install the signing dependency before any credential exists
        if: vars.FIRMWARE_SIGNING_KMS_KEY != ''
        run: python -m pip install --disable-pip-version-check cryptography==46.0.7

      # Direct WIF (no service account): the federated token is the auth_token output.
      # Through a service account: token_format access_token mints a 5-minute access token.
      # Both outputs are masked by the action; no credentials file and no env exports.
      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: gcp-auth
        if: vars.FIRMWARE_SIGNING_KMS_KEY != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.FIRMWARE_SIGNING_WIF_PROVIDER }}
          service_account: ${{ vars.FIRMWARE_SIGNING_SERVICE_ACCOUNT }}
          token_format: ${{ vars.FIRMWARE_SIGNING_SERVICE_ACCOUNT != '' && 'access_token' || '' }}
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Sign the manifest with Cloud KMS and verify the signature before upload
        id: sign
        if: vars.FIRMWARE_SIGNING_KMS_KEY != ''
        env:
          KMS_KEY: ${{ vars.FIRMWARE_SIGNING_KMS_KEY }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token || steps.gcp-auth.outputs.auth_token }}
        run: |
          set -euo pipefail
          python firmware/esp32-csi-node/tools/release_manifest.py sign \
            --manifest release-assets/firmware-manifest.json \
            --out release-assets/firmware-manifest.json.sig --kms-key "$KMS_KEY"
          python firmware/esp32-csi-node/tools/release_manifest.py verify --manifest release-assets/firmware-manifest.json \
            --sig release-assets/firmware-manifest.json.sig \
            --public-key firmware/esp32-csi-node/release-signing/public-key.ed25519.b64 --assets release-assets
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the archives and manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/firmware-manifest.json

      - name: Publish the downloadable firmware bundles
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: ESP32 firmware ${{ github.ref_name }}
          # A full release only when the channel is stable AND CI signed with Cloud KMS. Otherwise a
          # prerelease; the maintainer's `release_manifest.py sign-release` (fallback) clears the
          # flag for the stable channel only after its signature upload succeeds.
          prerelease: ${{ !(steps.channel.outputs.channel == 'stable' && steps.sign.outputs.signed == 'true') }}
          make_latest: false
          body: |
            Exact-run ESP32-S3 display 8 MB, ESP32-S3 headless 4 MB, ESP32-C6 4 MB, and ESP32-C5 4 MB firmware bundles.
            Manifest channel: ${{ steps.channel.outputs.channel }}.
            Verify each archive against `SHA256SUMS.txt` before flashing.
            `firmware-manifest.json` lists each variant's images, SHA-256 digests and flash offsets taken from the bundled `flasher_args.json`.
            ${{ steps.sign.outputs.signed == 'true' && '`firmware-manifest.json.sig` was produced in CI with the project Cloud KMS Ed25519 key and verified against the committed public key before upload.' || '`firmware-manifest.json` is UNSIGNED: it proves integrity and offsets, not origin. A maintainer signs it with `release_manifest.py sign-release` (fallback), which adds `firmware-manifest.json.sig` and, for the stable channel, marks this release non-prerelease.' }}
            Verify: `python3 firmware/esp32-csi-node/tools/release_manifest.py verify-release --tag ${{ github.ref_name }}` (reports signed and verified, or unsigned), or run the `Firmware release verify` workflow.
            Build provenance: `gh attestation verify <archive> -R ${{ github.repository }}`.
            CI builds and host tests verify software behavior, not target hardware.
            This release has no new physical-board qualification or sensing-accuracy claim.
            Select the matching board configuration using firmware/esp32-csi-node/README.md.
          files: release-assets/*
