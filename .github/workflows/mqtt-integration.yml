name: ADR-115 MQTT integration tests

# Runs the Mosquitto-broker-backed integration tests for ADR-115's MQTT
# publisher. These prove the publisher reaches a real broker, emits the
# expected HA-discovery topic shape, and honours --privacy-mode at the
# wire boundary (not just in unit-test logic).
#
# Default `cargo test --workspace` does not run these tests because they
# require a broker and pull rumqttc into the build. This workflow opts
# into both by setting --features mqtt and RUVIEW_RUN_INTEGRATION=1.

on:
  pull_request:
    paths:
      - 'v2/crates/wifi-densepose-sensing-server/src/mqtt/**'
      - 'v2/crates/wifi-densepose-sensing-server/tests/mqtt_integration.rs'
      - 'v2/crates/wifi-densepose-sensing-server/Cargo.toml'
      - '.github/workflows/mqtt-integration.yml'
      # The blueprint check reads the MQTT planner, so blueprint edits and
      # validator edits must run it too.
      - 'examples/ha-blueprints/**'
      - 'scripts/validate-ha-blueprints.py'
  push:
    branches: [main]
    paths:
      - 'v2/crates/wifi-densepose-sensing-server/src/mqtt/**'
      - 'examples/ha-blueprints/**'
      - 'scripts/validate-ha-blueprints.py'
  workflow_dispatch: {}

jobs:
  mqtt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Explicit vendor broker config; publish only the CI loopback port.
    # No APT package install or production MQTT security policy is involved.

    env:
      RUVIEW_RUN_INTEGRATION: "1"
      RUVIEW_TEST_MQTT_PORT: "11883"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Start pinned Mosquitto broker with CI-only anonymous listener
        run: |
          cat > "$RUNNER_TEMP/mosquitto-ci.conf" <<'CONFIG'
          listener 1883
          allow_anonymous true
          persistence false
          log_dest stdout
          CONFIG
          docker run --detach --user mosquitto --name ruview-mqtt-ci \
            --publish 127.0.0.1:11883:1883 \
            --mount "type=bind,source=$RUNNER_TEMP/mosquitto-ci.conf,target=/mosquitto/config/mosquitto.conf,readonly" \
            eclipse-mosquitto:2.0.18@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
          for i in {1..20}; do
            if docker exec ruview-mqtt-ci mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok -q 0 \
              && python3 -c 'import socket; socket.create_connection(("127.0.0.1", 11883), timeout=3).close()'; then
              exit 0
            fi
            sleep 1
          done
          docker logs ruview-mqtt-ci
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: v2 -> target

      - name: Validate HA Blueprints
        run: |
          python -m pip install --quiet pyyaml
          python scripts/validate-ha-blueprints.py

      - name: Verify MQTT-feature unit tests
        working-directory: v2
        # Keep this broker workflow focused on the feature it changes. The full
        # library/workspace and temporal Release suites run in ci.yml; repeating
        # long learner training here exhausted this job before broker tests ran.
        run: >-
          cargo test --locked -p wifi-densepose-sensing-server
          --features mqtt --no-default-features
          --lib mqtt::
          --no-fail-fast

      - name: Run integration tests against mosquitto
        working-directory: v2
        run: >-
          cargo test -p wifi-densepose-sensing-server
          --features mqtt --no-default-features
          --test mqtt_integration
          --no-fail-fast
          -- --test-threads=1 --nocapture

      - name: Dump broker logs on failure
        if: failure()
        run: |
          docker logs ruview-mqtt-ci || true

      - name: Stop the owned CI broker
        if: always()
        run: docker rm --force ruview-mqtt-ci
