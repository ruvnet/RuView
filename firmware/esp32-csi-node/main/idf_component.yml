## ESP-IDF Managed Component Dependencies (ADR-045)
dependencies:
  ## LVGL graphics library
  lvgl/lvgl:
    version: "~8.3"
    rules:
      - if: "target != esp32c5"

  ## CST816S capacitive touch driver
  espressif/esp_lcd_touch_cst816s:
    version: "^1.0"
    rules:
      - if: "target != esp32c5"

  ## LCD touch abstraction
  espressif/esp_lcd_touch:
    version: "^1.0"
    rules:
      - if: "target != esp32c5"

  ## Onboard WS2812 LED Disabling
  # 3.1.0 needs the IDF >= 5.5 API rmt_tx_switch_gpio; stay on 3.0.x for IDF 5.4
  espressif/led_strip: "~3.0.3"

  ## cJSON for config_api.c.
  ## Bundled as the `json` component up to ESP-IDF 5.x and moved out to the
  ## component manager in v6, so it is pulled ONLY on the v6+ lane -- on 5.4
  ## `main/CMakeLists.txt` requires the built-in `json` instead. Taking it from
  ## the registry on 5.x as well would mean two cJSON implementations in one
  ## build.
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
