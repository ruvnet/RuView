[package]
name = "wifi-densepose-pointcloud"
version = "0.1.0"
edition = "2021"
description = "Real-time dense point cloud from camera depth + WiFi CSI tomography"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ruview-pointcloud"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
dirs = "5"
reqwest = { version = "0.12", features = ["json"], default-features = false }
# Reference ADR-018 parser (esp32_parser) — single source of the frame layout.
wifi-densepose-hardware = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "splats_bench"
harness = false
