[package]
name = "wifi-densepose-nn"
version = "0.3.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords = ["neural-network", "onnx", "inference", "densepose", "deep-learning"]
categories = ["science", "computer-vision"]
description = "Neural network inference for WiFi-DensePose pose estimation"
readme = "README.md"

[features]
default = ["onnx"]
onnx = ["ort"]
tch-backend = ["tch"]
candle-backend = ["candle-core", "candle-nn"]
cuda = ["onnx"]
tensorrt = ["onnx"]
all-backends = ["onnx", "tch-backend", "candle-backend"]

[dependencies]
# Core utilities
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Tensor operations
ndarray.workspace = true
num-traits.workspace = true

# ONNX Runtime (default)
ort = { workspace = true, optional = true }

# PyTorch backend (optional)
tch = { workspace = true, optional = true }

# Candle backend (optional)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt"] }

# Additional utilities
parking_lot = "0.12"
memmap2 = "0.9"

# Input tensor loading for the cpu-inference-bench binary (pure Rust)
ndarray-npy.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3.10"

[[bench]]
name = "inference_bench"
harness = false

[[bench]]
name = "onnx_bench"
harness = false
required-features = ["onnx"]

[[bench]]
name = "native_conv_bench"
harness = false

# Reproducible CPU inference benchmark (cpu-micro-fp32 / cpu-micro-int8).
# Requires the `onnx` feature for model execution; without a `--model` it
# runs a pipeline-only smoke check.
[[bin]]
name = "cpu-inference-bench"
path = "src/bin/cpu_inference_bench.rs"
required-features = ["onnx"]
