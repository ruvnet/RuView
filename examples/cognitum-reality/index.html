<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cognitum Reality</title><style>body{margin:0;background:#07101b;color:#dcecf5;font:15px system-ui}header{padding:20px;border-bottom:1px solid #294558}h1{margin:0}main{max-width:1000px;margin:auto;padding:20px}canvas{width:100%;height:65vh;border:1px solid #26495f;border-radius:15px;background:radial-gradient(#15364b,#07101b)}b{color:#6af1d4}.warn{color:#f8c775}</style><header><h1>Cognitum Reality</h1><p>Live world state visualization prototype · <b>SYNTHETIC DATA</b></p></header><main><canvas id="world"></canvas><p id="status" class="warn">Synthetic room and person path. Not connected to Cognitum Spaces or physical sensors.</p></main><script type="module">
const c=document.querySelector('#world'),g=c.getContext('2d');let n=0;const scene={version:1,siteId:'demo-room',source:'synthetic',sequence:0,entities:[]};
function draw(){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const s=Math.min(c.width/12,c.height/9);const p=(x,z)=>[c.width/2+(x-z)*s*.85,c.height*.48+(x+z)*s*.43];const line=(a,b)=>{g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()};g.strokeStyle='#1a4658';for(let x=-3.5;x<=3.5;x+=.5)line(p(x,-3),p(x,3));for(let z=-3;z<=3;z+=.5)line(p(-3.5,z),p(3.5,z));const t=n/20;scene.sequence=++n;scene.entities=[{id:'person-1',kind:'person',position:[Math.sin(t)*2.3,0,Math.cos(t)*1.7],confidence:.88,evidence:'synthetic'}];for(const e of scene.entities){if(e.evidence!==scene.source)throw Error('Evidence mismatch');const [x,y]=p(e.position[0],e.position[2]);g.fillStyle='#59f2c8';g.beginPath();g.arc(x,y-12*d,9*d,0,Math.PI*2);g.fill();g.fillRect(x-3*d,y-5*d,6*d,23*d);g.fillStyle='#e1f5f9';g.textAlign='center';g.font=`${11*d}px monospace`;g.fillText('SYNTHETIC / '+e.id,x,y-30*d)}document.querySelector('#status').textContent='Source: SYNTHETIC · Scene: '+scene.siteId+' · Frame: '+n+' · No verified sensor data';}
setInterval(draw,100);draw();</script></html>
